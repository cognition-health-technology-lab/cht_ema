name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

template: |
  ## Changes
  $CHANGES

  ## Contributors
  $CONTRIBUTORS

categories:
  # ================================
  # 📦 cht_cognition
  # ================================
  - title: "## 📦 cht_cognition — 🚀 Features"
    labels: [pkg:cognition:feature]

  - title: "## 📦 cht_cognition — 🐞 Fixes"
    labels: [pkg:cognition:fix]

  - title: "## 📦 cht_cognition — 🧪 Tests"
    labels: [pkg:cognition:test]

  - title: "## 📦 cht_cognition — 🛠️ Improvements / Refactors"
    labels:
      [pkg:cognition:improvement, pkg:cognition:refactor, pkg:cognition:perf]

  - title: "## 📦 cht_cognition — 📚 Documentation"
    labels: [pkg:cognition:documentation]

  - title: "## 📦 cht_cognition — ⚙️ CI / Chores / Deps"
    labels: [pkg:cognition:ci, pkg:cognition:chore, pkg:cognition:dependencies]

  - title: "## 📦 cht_cognition — ✨ Other changes"
    labels: [pkg:cognition]

  # ================================
  # 📦 cht_ema_surveys
  # ================================
  - title: "## 📦 cht_ema_surveys — 🚀 Features"
    labels: [pkg:surveys:feature]

  - title: "## 📦 cht_ema_surveys — 🐞 Fixes"
    labels: [pkg:surveys:fix]

  - title: "## 📦 cht_ema_surveys — 🧪 Tests"
    labels: [pkg:surveys:test]

  - title: "## 📦 cht_ema_surveys — 🛠️ Improvements / Refactors"
    labels: [pkg:surveys:improvement, pkg:surveys:refactor, pkg:surveys:perf]

  - title: "## 📦 cht_ema_surveys — 📚 Documentation"
    labels: [pkg:surveys:documentation]

  - title: "## 📦 cht_ema_surveys — ⚙️ CI / Chores / Deps"
    labels: [pkg:surveys:ci, pkg:surveys:chore, pkg:surveys:dependencies]

  - title: "## 📦 cht_ema_surveys — ✨ Other changes"
    labels: [pkg:surveys]

change-template: "- $TITLE (#$NUMBER) by @$AUTHOR"

exclude-labels:
  - skip-changelog
  - wip

version-resolver:
  major:
    labels:
      - breaking
      - "semver:major"
  minor:
    labels:
      - feature
      - "semver:minor"
      - pkg:cognition:feature
      - pkg:surveys:feature
  patch:
    labels:
      - fix
      - test
      - documentation
      - refactor
      - improvement
      - ci
      - chore
      - dependencies
      - perf
      - revert
      - "semver:patch"
      - pkg:cognition:fix
      - pkg:cognition:test
      - pkg:cognition:documentation
      - pkg:cognition:refactor
      - pkg:cognition:improvement
      - pkg:cognition:ci
      - pkg:cognition:chore
      - pkg:cognition:dependencies
      - pkg:cognition:perf
      - pkg:cognition:revert
      - pkg:surveys:fix
      - pkg:surveys:test
      - pkg:surveys:documentation
      - pkg:surveys:refactor
      - pkg:surveys:improvement
      - pkg:surveys:ci
      - pkg:surveys:chore
      - pkg:surveys:dependencies
      - pkg:surveys:perf
      - pkg:surveys:revert
  default: patch

autolabeler:
  # type-package compound labels: cognition
  - label: pkg:cognition:feature
    title: ['/^(feature|feat)\(cognition\):/i']

  - label: pkg:cognition:fix
    title: ['/^(fix|bug)\(cognition\):/i']

  - label: pkg:cognition:test
    title: ['/^(test|tests)\(cognition\):/i']

  - label: pkg:cognition:documentation
    title: ['/^(doc|docs|documentation)\(cognition\):/i']

  - label: pkg:cognition:refactor
    title: ['/^(refactor)\(cognition\):/i']

  - label: pkg:cognition:improvement
    title: ['/^(improve|improvement)\(cognition\):/i']

  - label: pkg:cognition:perf
    title: ['/^(perf|performance)\(cognition\):/i']

  - label: pkg:cognition:ci
    title: ['/^(ci)\(cognition\):/i']

  - label: pkg:cognition:chore
    title: ['/^(chore)\(cognition\):/i']

  - label: pkg:cognition:dependencies
    title: ['/^(deps|dependencies)\(cognition\):/i']

  # type-package compound labels: surveys
  - label: pkg:surveys:feature
    title: ['/^(feature|feat)\(surveys\):/i']

  - label: pkg:surveys:fix
    title: ['/^(fix|bug)\(surveys\):/i']

  - label: pkg:surveys:test
    title: ['/^(test|tests)\(surveys\):/i']

  - label: pkg:surveys:documentation
    title: ['/^(docs|doc|documentation)\(surveys\):/i']

  - label: pkg:surveys:refactor
    title: ['/^(refactor)\(surveys\):/i']

  - label: pkg:surveys:improvement
    title: ['/^(improve|improvement)\(surveys\):/i']

  - label: pkg:surveys:perf
    title: ['/^(perf|performance)\(surveys\):/i']

  - label: pkg:surveys:ci
    title: ['/^(ci)\(surveys\):/i']

  - label: pkg:surveys:chore
    title: ['/^(chore)\(surveys\):/i']

  - label: pkg:surveys:dependencies
    title: ['/^(deps|dependencies)\(surveys\):/i']

  # monorepo-wide "general" (no package)
  - label: general
    title:
      [
        '/^(feature|feat)\(general\):/i',
        '/^(fix|bug)\(general\):/i',
        '/^(test|tests)\(general\):/i',
        '/^(doc|docs|documentation)\(general\):/i',
        '/^(refactor)\(general\):/i',
        '/^(improve|improvement)\(general\):/i',
        '/^(perf|performance)\(general\):/i',
        '/^(revert)\(general\):/i',
        '/^(ci)\(general\):/i',
        '/^(chore)\(general\):/i',
        '/^(deps|dependencies)\(general\):/i',
      ]

  # basic labels if nothing more specific matches
  - label: feature
    title: ['/^(feature|feat)\([^)]*\):/i']

  - label: fix
    title: ['/^(fix|bug)\([^)]*\):/i']

  - label: test
    title: ['/^(test|tests)\([^)]*\):/i']

  - label: documentation
    title: ['/^(docs|doc|documentation)\([^)]*\):/i']

  - label: refactor
    title: ['/^(refactor)\([^)]*\):/i']

  - label: improvement
    title: ['/^(improve|improvement)\([^)]*\):/i']

  - label: perf
    title: ['/^(perf|performance)\([^)]*\):/i']

  - label: revert
    title: ['/^(revert)\([^)]*\):/i']

  - label: ci
    title: ['/^(ci)\([^)]*\):/i']

  - label: chore
    title: ['/^(chore)\([^)]*\):/i']

  - label: dependencies
    title: ['/^(deps|dependencies)\([^)]*\):/i']
