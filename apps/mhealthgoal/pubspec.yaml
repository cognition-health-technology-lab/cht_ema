name: mhealthgoal
description: "App that collects EF, ER, and physical activity data for scientific research."
publish_to: "none"
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    #- assets/fonts/
    - assets/fonts

  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700

    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif-Regular.ttf

    - family: BaskervilleBT
      fonts:
        - asset: assets/fonts/BaskervilleBT-Roman.ttf
