name: cht_cognition
resolution: workspace
description: "Provides pre-built cognitive_tasks for use in ecological momentary assessment (EMA) studies."
version: 0.0.1
publish_to: "none" # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ^3.9.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^3.1.0
  intl: any
  research_package:
    git:
      url: https://github.com/mario-bermonti/research.package.git
      ref: 90829448e20fa72ce34ee740dac25849078cb2de

dev_dependencies:
  build_runner: ^2.10.4
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3

flutter:
  generate: true
  assets:
    - lib/src/core/l10n/
